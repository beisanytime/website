<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasmo Beis</title>
    <meta name="description"
        content="Watch shiurim from Rabbi Hartman, Rabbi Rosenfeld, and Rabbi Golker anytime. Hasmo Beis — a premium Torah streaming platform.">

    <!-- Preconnect & DNS-Prefetch for Performance -->
    <link rel="preconnect" href="https://pub-7e0e719e722744199ebdc5c17d7b08d4.r2.dev">
    <link rel="dns-prefetch" href="https://pub-7e0e719e722744199ebdc5c17d7b08d4.r2.dev">
    <link rel="preconnect" href="https://api.beisanytime.com">
    <link rel="dns-prefetch" href="https://api.beisanytime.com">

    <!-- Fonts: Inter for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Sign-In -->
    <link rel="preconnect" href="https://accounts.google.com">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-shell">

        <!-- Top Header Bar -->
        <header class="site-header">
            <div class="header-inner">
                <a href="#" class="logo nav-link" onclick="loadPage('home'); return false;">
                    <img src="logo.png" alt="Hasmo Beis" style="height: 30px; width: auto;">
                    <span>HASMO BEIS</span>
                </a>

                <nav class="header-nav header-nav-primary" aria-label="Library">
                    <a href="#" class="nav-item active" data-page="home">
                        <i class="fas fa-home"></i> Home
                    </a>
                    <a href="#" class="nav-item" data-page="all">
                        <i class="fas fa-compass"></i> Browse
                    </a>
                    <a href="#" class="nav-item" data-page="speakers">
                        <i class="fas fa-microphone-lines"></i> Speakers
                    </a>
                    <a href="#" class="nav-item" data-page="time4mishna">
                        <i class="fas fa-clock"></i> Time4Mishna
                    </a>
                </nav>

                <div class="header-search">
                    <div class="search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="globalSearch" class="search-input" placeholder="Search shiurim...">
                    </div>
                </div>

                <div class="header-actions">
                    <a href="#" class="nav-item" data-page="community">
                        <i class="fas fa-users"></i> Community
                        <span class="nav-badge" id="community-badge" style="display:none;"></span>
                    </a>
                    <a href="#" class="nav-item" data-page="bookmarks">
                        <i class="fas fa-bookmark"></i> Watch Later
                    </a>

                    <button class="btn btn-secondary btn-icon header-icon-btn" id="theme-toggle"
                        aria-label="Toggle dark mode">
                        <i class="fas fa-moon"></i>
                    </button>

                    <div id="desktop-auth-container">
                        <button class="btn btn-primary btn-sm js-google-sign-in">Sign In</button>
                    </div>

                    <div class="profile-wrapper" id="profileDropdown" style="display: none;">
                        <button class="profile-trigger" id="profileToggle" aria-label="Account menu">
                            <img id="userAvatar" src="" class="avatar" alt="User">
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-viewport">
            <div id="app-content" class="page-container">
                <!-- Content injected here -->
                <div class="grid-videos">
                    <div class="skeleton" style="height: 250px;"></div>
                    <div class="skeleton" style="height: 250px;"></div>
                    <div class="skeleton" style="height: 250px;"></div>
                </div>
            </div>
        </main>

        <!-- Mobile Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#" class="bottom-nav-item active" data-page="home">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="#" class="bottom-nav-item" data-page="all">
                <i class="fas fa-compass"></i> Browse
            </a>
            <a href="#" class="bottom-nav-item" data-page="community">
                <div style="position:relative;">
                    <i class="fas fa-users"></i>
                    <span class="nav-badge-mobile" id="community-badge-mobile" style="display:none;"></span>
                </div>
                Feed
            </a>
            <a href="#" class="bottom-nav-item" data-page="bookmarks">
                <i class="fas fa-bookmark"></i>
                Later
            </a>
            <a href="#" class="bottom-nav-item" data-page="time4mishna">
                <i class="fas fa-clock"></i> Mishna
            </a>
        </nav>

    </div>

    <!-- GLOBAL DROPDOWN MENU -->
    <div class="popup-menu" id="globalMenu">

        <!-- Logged In State -->
        <div id="menuLoggedIn" style="display:none;">
            <div class="menu-header">
                <div id="menuUserName" style="font-weight: 600; font-size: 0.95rem;"></div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Member</div>
            </div>

            <a href="#" class="nav-item" id="adminLink" style="display: none;"
                onclick="loadPage('admin'); return false;">
                <i class="fas fa-shield-alt"></i> Admin Panel
            </a>

            <!-- UPLOAD LINK -->
            <a href="#" class="nav-item" id="uploadLink" style="display: none;"
                onclick="loadPage('upload'); return false;">
                <i class="fas fa-upload"></i> Upload Shiur
            </a>

            <a href="#" class="nav-item" id="signOutBtn" style="color: var(--c-golker);">
                <i class="fas fa-sign-out-alt"></i> Sign Out
            </a>
        </div>

        <!-- Logged Out State -->
        <div id="menuLoggedOut" style="text-align:center; padding: 12px;">
            <p style="font-size: 0.9rem; margin-bottom: 12px; color: var(--text-muted);">Sign in to access features.</p>
            <button class="btn btn-primary js-google-sign-in" style="width:100%">
                Sign In with Google
            </button>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="script.js" defer></script>
</body>

</html>
